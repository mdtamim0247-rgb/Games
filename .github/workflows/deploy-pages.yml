name: Deploy DHAKA OPEN WORLD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Game
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          HTML=$(find extracted -name index.html | head -n 1)
          test -n "$HTML"
          DIR=$(dirname "$HTML")
          mkdir public
          cp -a "$DIR"/. public/
          test -s public/index.wasm
          test -s public/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
